<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <my-card header="Выбор опций" sub-header="Выберите подходящие значения">
        <my-select>
        <option value="opt1">Option 1</option>
        <option value="opt2">Option 2</option>
        <option value="opt3">Option 3</option>
        </my-select>
        <p>Выбрано: <output id="selected-values">—</output></p>
        <span slot="footer">Можно выбрать несколько значений</span>
    </my-card>

    <script>
        const components = ['my-select', 'my-card'];
        document.querySelector('my-select').addEventListener('change', event => {
            document.querySelector('#selected-values').textContent = event.target.value || '—';
        });

        const onLoad = (evt) => {
            const scriptEl = evt.currentTarget;
            const { name } = scriptEl.dataset;
            if (!name) {
                console.warn('Component name is not provided in data-name attribute.');
                return;
            }

            if (!customElements.get(name)) {
                console.warn(`Custom element "${name}" is not registered yet.`);
                return;
            }
        };

        const onError = (evt) => {
            const scriptEl = evt.currentTarget;
            const { name } = scriptEl.dataset;
            console.error(`Failed to load component "${name ?? 'unknown'}".`, evt);
        };

        components.forEach((component) => {
            const script = document.createElement('script');
            script.src = `./${component}.js`;
            script.dataset.name = component;
            script.addEventListener('load', onLoad, { once: true });
            script.addEventListener('error', onError, { once: true });
            document.body.append(script);
        });
    </script>
</body>
</html>
