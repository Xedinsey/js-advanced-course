<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Web Workers API</title>
    <style>
        body { font: 16px system-ui, sans-serif; margin: 40px; }
        button { padding: 10px 16px; margin: 0 8px 16px 0; }
        .spinner { width: 32px; height: 32px; border: 4px solid #ddd; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Web Workers API</h1>
    <button id="once">Start: завершить воркер после расчёта</button>
    <button id="reuse">Start: переиспользовать воркер</button>
    <div class="spinner" aria-label="Анимация основного потока"></div>
    <p id="status" role="status">Готово к запуску</p>
    <output id="result"></output>
    <script src="./app.js"></script>
</body>
</html>
